spring.application.name=clothing-platform-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/clothing-platform
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/clothing-platform

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB